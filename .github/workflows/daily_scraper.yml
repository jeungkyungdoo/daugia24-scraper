name: Daily Vietnam Auction Sync

on:
  schedule:
    # 베트남 시간 오전 03:00 (UTC 20:00 / 한국 시간 05:00) 매일 자동 실행
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 가동 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase python-dateutil urllib3

      - name: 법무부 경매 데이터 크롤링 및 수파베이스 동기화 실행
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python pipeline_scraper.py 
